name: Build Zenci AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip -q ZenciAI_Android_1.0.zip

      - name: Build APK
        working-directory: ZenciAI_Android
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ZenciAI-APK
          path: ZenciAI_Android/app/build/outputs/apk/debug/app-debug.apk 
